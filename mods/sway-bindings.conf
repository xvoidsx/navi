# hey-lain keybinding (wired is sway-compatible, same IPC).
# Paste this ONE line into ~/.config/sway/config (replacing the old
# press/release pair), then: swaymsg reload
#
# Tap Alt+V to start listening, tap again to stop + transcribe + reply.
# --no-repeat is load-bearing: without it, holding the key flaps the toggle.
bindsym --no-repeat Alt+v exec $HOME/hey-lain/bin/toggle.sh
