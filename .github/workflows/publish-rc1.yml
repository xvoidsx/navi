name: Publish Mika RC1 release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful ISO build run ID to publish"
        required: true
        default: "34462615883"
      tag:
        description: "Release tag (must already point at the ISO build commit)"
        required: true
        default: "v1.2-mika-RC1"
      target_sha:
        description: "Commit the tag points at"
        required: true
        default: "04622f4c47413241980dbe2feca638ffa5304e56"
  # Push trigger exists so GitHub registers/executes this workflow from the
  # mika branch (workflow_dispatch alone is not reliably dispatchable until
  # the file lands on the default branch). Pushing this file publishes RC1.
  push:
    branches: [mika]
    paths:
      - .github/workflows/publish-rc1.yml

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: navi_1.2_mika_RC1.iso
          # inputs.* only exist on workflow_dispatch; fall back on push events
          run-id: ${{ inputs.run_id || '34462615883' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Verify ISO and checksum it
        run: |
          set -euo pipefail
          ls -lh dist
          ISO="$(ls dist/*.iso | head -n 1)"
          test -s "$ISO"
          ( cd dist && sha256sum "$(basename "$ISO")" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"

      - name: Create the prerelease and attach the ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # inputs.* only exist on workflow_dispatch; fall back on push events
          TAG: ${{ inputs.tag || 'v1.2-mika-RC1' }}
          TARGET_SHA: ${{ inputs.target_sha || '04622f4c47413241980dbe2feca638ffa5304e56' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting it first"
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            "$ISO_PATH" dist/SHA256SUMS.txt \
            --target "$TARGET_SHA" \
            --title "navi 1.2 mika RC1 (test build)" \
            --prerelease \
            --notes "$(cat <<'NOTES_EOF'
          # navi 1.2 "mika" — RC1 test build

          This is a **pre-release test build** for fresh-machine validation. It is not the final release.

          ## What to expect
          - UEFI x86_64 only (no BIOS/CSM, no Secure Boot)
          - Boots straight into the navi CLI installer — no live desktop
          - Full-disk LUKS2 encryption; you will type your passphrase **twice** at boot (GRUB, then initramfs) — expected
          - First boot needs network access to finish provisioning the desktop
          - SDDM autologs you into the wired after provisioning

          ## Verify
          Compare against `SHA256SUMS.txt` attached below.

          ## Feedback
          Anything weird goes back to the mika branch — this build is the gate for the final `v1.2-mika` release.
          NOTES_EOF
          )"
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
