# navi ISO builder (1.4.4 "mika" stable).
#
# Builds the installer ISO inside a privileged debian:trixie container and
# uploads it as a workflow artifact. These builds are heavy (debootstrap +
# a full live image), so the push trigger is path-filtered to ISO-relevant
# changes only.
#
# NOTE on triggers: GitHub only registers workflows it sees on the default
# branch. `main` is the default branch (mika merged for the 1.3 release),
# so `workflow_dispatch` works from the Actions tab and the push trigger
# below runs builds on ISO-relevant changes.
#
# The container route (instead of ubuntu-latest + sudo) keeps the whole
# build on real Debian tooling: live-build, debootstrap, and friends from
# trixie itself.

name: navi ISO (1.4.4 "mika")

# === RELEASE CHECKLIST ===
# Bump BOTH values below for every new release. Everything downstream derives
# the image name, volume label, and artifact name from them.
# Forgetting this ships a misnamed artifact and breaks the publish workflow
# (this bit us on RC19: the build produced navi-1.2-mika-RC18.iso while
# publish-rc19.yml looked for the RC19 name — fixed going forward).
#
# THEN double-check the human-facing version strings — they are NOT derived
# from the values below and go stale silently (1.4 shipped an installer that
# still said 1.3; caught on the Cloudbook, fixed in 1.4.3):
#   - wired/VERSION                     (install.sh reads this; single source of truth)
#   - wired/identity/*                    (os-release, lsb-release, issue, issue.net —
#                                        install.sh now re-stamps these from wired/VERSION
#                                        at deploy time, but keep the repo copies right too)
#   - iso/installer/navi-install        (banner line + "is installed" box — keep the
#                                        box-drawing padding aligned after the bump)
#   - iso/stage.sh payload              (install.sh, wired/, scripts/, iso/installer —
#                                        scripts/ holds navi-update + navi-wired-restore;
#                                        leaving it out silently drops them from fresh
#                                        installs, caught on the Cloudbook in 1.4)
#   - iso/README.md                     (pipeline doc header)
#   - the workflow name/comment/volume label in this file
#
# AND test any script that parses external tool output against the REAL
# output shape — not a mock (1.4.2 shipped navi-notifs parsing dunst's
# history as plain strings; real `dunstctl history` is busctl JSON where
# every D-Bus variant arrives wrapped as {"type": "<sig>", "data": <value>}.
# caught on the Cloudbook, fixed in 1.4.3):
#
# POST-RELEASE (after the tag + publish-stable.yml succeed — the site goes
# stale silently too, and 1.4.2 proved it):
#   - xvoidsx/enter-the-wired (local copy ~/workspace/navi-site): bump
#     version strings in index.html + roadmap.html, add a news.html entry
#     at the top of the feed; keep download buttons pointed at
#     github.com/xvoidsx/navi/releases/latest so they never pin to an old
#     tag. Fetch each file's remote version first and diff — the local
#     copy can lag (it lost the 1.4.2 news entry once, caught pre-push).
#     Push with gh-push-mika --repo xvoidsx/enter-the-wired --branch main
#     --root ~/workspace/navi-site, passing the changed files explicitly.
#   - navi repo README.md: bump any human-facing version strings (check
#     with grep, same as the installer banner).
env:
  RELEASE: 1.4.4
  ISO_BASENAME: navi-1.4.4-mika

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iso/**'
      - 'install.sh'
      - 'wired/**'
      - 'scripts/**'
      - '.github/workflows/iso.yml'

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    steps:
      # NOTE: actions/checkout needs node, which debian:trixie-slim lacks,
      # so the repo is cloned with plain git instead.
      - name: Clone navi (main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates
          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/xvoidsx/navi.git" src
          cd src && git rev-parse --short HEAD

      # nodejs: JS actions (upload-artifact) run inside the container and
      # need node; trixie ships node 20, which actions/*@v4 require.
      - name: Install live-build
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq live-build nodejs

      - name: Stage the live-build tree
        run: |
          set -euo pipefail
          cd src && ./iso/stage.sh

      - name: Build the ISO
        run: |
          set -euo pipefail
          cd src/iso/build
          # NOTE: the lb config flags are inline here on purpose. live-build
          # auto-executes an executable auto/config script — and ours has to
          # call `lb config` itself, which recursed forever and red-lit the
          # first build. With no auto/config in the tree, `lb config` below
          # just configures.
          lb config \
            --distribution trixie \
            --archive-areas "main contrib non-free non-free-firmware" \
            --bootloaders "syslinux grub-efi" \
            --binary-images iso-hybrid \
            --debian-installer false \
            --memtest none \
            --iso-application "navi" \
            --iso-publisher "xvoidsx" \
            --iso-volume "navi 1.4.4 mika" \
            --image-name "$ISO_BASENAME"
          lb build

      - name: Collect the ISO
        run: |
          set -euo pipefail
          iso_path="$(ls src/iso/build/${ISO_BASENAME}-*.hybrid.iso | head -n 1)"
          cp "$iso_path" "/tmp/${ISO_BASENAME}.iso"
          ls -lh "/tmp/${ISO_BASENAME}.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_BASENAME }}.iso
          path: /tmp/${{ env.ISO_BASENAME }}.iso
          if-no-files-found: error
