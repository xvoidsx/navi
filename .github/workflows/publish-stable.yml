name: Publish navi stable ISO

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Successful stable ISO build run ID to publish"
        required: true
        default: "00000000000"
      tag:
        description: "Release tag (must already point at the ISO build commit)"
        required: true
        default: "v1.4-mika"
      artifact:
        description: "ISO build artifact name (from the iso.yml ISO_BASENAME)"
        required: true
        default: "navi-1.4-mika.iso"
      target_sha:
        description: "Commit the tag points at"
        required: true
        default: "ffffffffffffffffffffffffffffffffffffffff"

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out the repo (gh needs git context)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - name: Verify ISO and checksum it
        run: |
          set -euo pipefail
          ls -lh dist
          ISO="$(ls dist/*.iso | head -n 1)"
          test -s "$ISO"
          ( cd dist && sha256sum "$(basename "$ISO")" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt
          echo "ISO_PATH=$ISO" >> "$GITHUB_ENV"

      - name: Upload the ISO to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The release shell is created ahead of time (Actions' GITHUB_TOKEN
          # cannot create releases on this repo); the runner just attaches
          # the built assets to it.
          gh release view "$TAG" >/dev/null \
            || { echo "release $TAG does not exist yet — aborting"; exit 1; }
          gh release upload "$TAG" "$ISO_PATH" dist/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
