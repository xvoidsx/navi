# kitty config — nightshadeNeon for navi
# this file belongs in: ~/.config/kitty/kitty.conf

# --- font ---
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 12.0

# --- window ---
background_opacity 0.9
window_padding_width 5
hide_window_decorations no
dynamic_title yes

# --- cursor ---
cursor #ff10f0
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0

# --- selection ---
selection_foreground #000000
selection_background #39ff14

# --- colors: nightshadeNeon ---
foreground #ffffff
background #000000

color0 #000000
color1 #ff3131
color2 #39ff14
color3 #00ffff
color4 #00ffff
color5 #ff10f0
color6 #00ffff
color7 #ffffff

color8 #555555
color9 #ff3131
color10 #39ff14
color11 #00ffff
color12 #00ffff
color13 #ff10f0
color14 #00ffff
color15 #ffffff

# --- tabs ---
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #000000
active_tab_background #ff10f0
inactive_tab_foreground #ffffff
inactive_tab_background #1a1a1a

# --- mouse ---
mouse_hide_wait 3.0

# --- performance (matters on old hardware) ---
repaint_delay 10
input_delay 3
sync_to_monitor yes
