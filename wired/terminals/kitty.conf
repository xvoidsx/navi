# kitty config — nightshadeNeon for navi
# this file belongs in: ~/.config/kitty/kitty.conf
#
# tiling keybindings follow navi conventions:
#   sway:  $mod+h/v splits, $mod+hjkl focus, $mod+shift+q kill
#   tmux:  prefix h/v splits, f zoom, Q kill pane
#   herdr: prefix h/v splits
# kitty_mod (ctrl+shift) is the kitty-native modifier, so nothing
# clashes with sway's Super. ctrl+shift+c/v stay as copy/paste.

# --- font ---
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 12.0

# --- window ---
background_opacity 0.9
window_padding_width 5
hide_window_decorations no

# --- cursor ---
cursor #ff10f0
cursor_text_color #000000
cursor_shape block
cursor_blink_interval 0

# --- selection ---
selection_foreground #000000
selection_background #39ff14

# --- colors: nightshadeNeon ---
foreground #ffffff
background #000000

color0 #000000
color1 #ff3131
color2 #39ff14
color3 #00ffff
color4 #00ffff
color5 #ff10f0
color6 #00ffff
color7 #ffffff

color8 #555555
color9 #ff3131
color10 #39ff14
color11 #00ffff
color12 #00ffff
color13 #ff10f0
color14 #00ffff
color15 #ffffff

# --- tabs ---
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #000000
active_tab_background #ff10f0
inactive_tab_foreground #ffffff
inactive_tab_background #1a1a1a

# --- mouse ---
mouse_hide_wait 3.0

# --- layouts ---
# splits first: it's the only layout that honors hsplit/vsplit hints.
# (kitty's default tall layout forces every new window to the same spot,
# which is why h and d looked identical.)
enabled_layouts splits,tall,grid,stack

# --- performance (matters on old hardware) ---
repaint_delay 10
input_delay 3
sync_to_monitor yes

# =========================================================
# tiling keybindings
# kitty_mod = ctrl+shift, so NEVER write kitty_mod+shift
# (that's just kitty_mod again — it silently stomps the
# non-shift binding). Secondary ops use alt instead.
# =========================================================

# splits — h for horizontal like sway/tmux/herdr.
# NOTE: ctrl+shift+v stays as PASTE (sacred) — vsplit lives on ctrl+shift+d
# instead, the iTerm2 convention.
map kitty_mod+h launch --location=hsplit --cwd=current
map kitty_mod+d launch --location=vsplit --cwd=current

# copy/paste are sacred — pinned explicitly so no remap can stomp them
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

# new tab — like tmux's Enter for a new window
map kitty_mod+enter launch --type=tab --cwd=current
map kitty_mod+t new_tab_with_cwd

# focus — ctrl+shift+arrows move around the grid
map kitty_mod+left neighboring_window left
map kitty_mod+right neighboring_window right
map kitty_mod+up neighboring_window up
map kitty_mod+down neighboring_window down

# move windows — alt+arrows swap with neighbor
map alt+left move_window left
map alt+right move_window right
map alt+up move_window up
map alt+down move_window down

# resize — ctrl+shift+r enters resize mode, arrows resize, esc/enter exits
map kitty_mod+r start_resizing_window

# kill the current pane ONLY (kitty "window" = pane, "tab" = tab)
map kitty_mod+q close_window
map kitty_mod+x close_window
# kill the whole tab
map ctrl+alt+q close_tab

# zoom — like tmux's f
map kitty_mod+f toggle_maximized

# layouts — like sway's $mod+e layout toggle
map kitty_mod+e next_layout
map kitty_mod+g goto_layout grid
map kitty_mod+s goto_layout stack

# tab switching — like sway workspaces
map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+page_up previous_tab
map kitty_mod+page_down next_tab

# scrollback — vim-style j/k
map kitty_mod+k scroll_page_up
map kitty_mod+j scroll_page_down

# hints (open urls, etc.)
map kitty_mod+o open_url_with_hints
