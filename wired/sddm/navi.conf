[Theme]
Current=navi
# Bibata on the login screen too: the greeter runs as the sddm user, so it
# never sees per-user cursor settings. Takes effect when sddm restarts
# (i.e. on reboot) — the running greeter won't pick it up live.
CursorTheme=Bibata-Modern-Ice
CursorSize=24

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on
