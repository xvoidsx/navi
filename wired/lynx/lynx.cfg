# navi / wired Lynx configuration
# Dark nightshadeNeon theme for the learn manual and general browsing.
# Pins every color pair to high-contrast values on black so text never
# gets blocked out by bad fg/bg combinations from lynx's light defaults.

# Syntax: COLOR:<pair>:<foreground>:<background>
#   pair 0 = normal text
#   pair 1 = links
#   pair 2 = status line
#   pair 3 = bold / emphasis
#   pair 4 = bold links
#   pair 5 = ...
#   pair 6 = ...

COLOR:0:white:black
COLOR:1:red:black
COLOR:2:black:cyan
COLOR:3:magenta:black
COLOR:4:brightred:black
COLOR:5:green:black
COLOR:6:cyan:black
COLOR:7:yellow:black

# --- behavior ---
# assume local charset is UTF-8 (the manual uses unicode art)
CHARACTER_SET:utf-8
LOCALE_CHARSET:TRUE

# show cursor position / link numbers to aid manual navigation
SHOW_CURSOR:TRUE
