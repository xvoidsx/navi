# navi / wired Lynx system configuration
# Dark nightshadeNeon theme for the learn manual and general browsing.
# Deploy to /etc/lynx.cfg (system-wide). Syntax per lynx.cfg man page:
#   COLOR:<pair>:<foreground>:<background>
#     0 = normal text        1 = hyperlinks (bold)
#     2 = statusline         3 = bold + reverse (unused)
#     4 = text emphasis      5 = hyperlinks in emphasis
#     6 = selected link      7 = search hits
#
# NOTE: these only take effect when lynx runs in color mode. navi ships
# ~/.lynxrc with show_color=always so color is on out of the box.

COLOR:0:white:black
COLOR:1:brightred:black
COLOR:2:black:cyan
COLOR:3:magenta:black
COLOR:4:brightmagenta:black
COLOR:5:green:black
COLOR:6:cyan:black
COLOR:7:yellow:black

# the manual uses unicode box art; assume UTF-8
CHARACTER_SET:utf-8
LOCALE_CHARSET:TRUE
SHOW_CURSOR:TRUE
