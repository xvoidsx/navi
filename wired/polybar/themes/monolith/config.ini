[colors]
background = #FF0A0A0A
foreground = #FFFFFFFF
primary = #FFFF10F0
secondary = #FF9A9A9A
cyan = #FF9A9A9A
alert = #FFFF3131
disabled = #FF505050
border = #FF2E2E2E

[bar/main]
width = 100%
height = 18pt
fixed-center = true
background = ${colors.background}
foreground = ${colors.foreground}
border-size = 1pt
border-color = ${colors.border}
border-top-size = 0
border-bottom-size = 1pt
border-bottom-color = ${colors.primary}
line-size = 1pt
line-color = ${colors.primary}
padding-left = 2
padding-right = 2
padding-top = 1
padding-bottom = 1
module-margin = 0.7
separator = " | "
separator-foreground = ${colors.disabled}
font-0 = Noto Sans:style=Bold:size=10;2
font-1 = MaterialDesignIcons-Regular:size=10;2
font-2 = FontAwesome:size=10;2
font-3 = Unifont:size=10;2
wm-restack = i3
enable-ipc = true
override-redirect = false
tray-position = right
tray-spacing = 6px
tray-padding = 4px
modules-left = wired-launcher xworkspaces xwindow
modules-center = date-1 date-2 date-3
modules-right = weather update volume bluetooth network battery tailscale agent bell tray custom/power

[module/wired-launcher]
type = custom/text
format = <label>
label = %{A1:rofi -show combi -modi window,drun,run:}∅%{A}
label-font = 3
label-foreground = ${colors.primary}
label-background = ${colors.background}
label-padding = 2

[module/xworkspaces]
type = internal/xworkspaces
format = <label-state>
label-active = %name%
label-active-foreground = ${colors.primary}
label-active-background = ${colors.background}
label-active-underline = ${colors.secondary}
label-active-padding = 1
label-occupied = %name%
label-occupied-foreground = ${colors.cyan}
label-occupied-background = ${colors.background}
label-occupied-padding = 1
label-urgent = %name%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.background}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.alert}
label-background = ${colors.background}
label-padding = 2

[module/date-1]
type = internal/date
interval = 1
date = %A
label = %{A1:st -e calcurse &:}%date%%{A}
label-foreground = ${colors.secondary}
label-background = ${colors.background}
label-padding = 2

[module/date-2]
type = internal/date
interval = 1
date = %H:%M
label = %{A1:st -e tty-clock &:}%date%%{A}
label-foreground = ${colors.secondary}
label-background = ${colors.background}
label-padding = 2

[module/date-3]
type = internal/date
interval = 1
date = %d %B
label = %{A1:gsimplecal &:}%date%%{A}
label-foreground = ${colors.secondary}
label-background = ${colors.background}
label-padding = 2

[module/volume]
type = custom/script
exec = /usr/share/navi/wired/polybar/volume-nowplaying.sh
interval = 2
label = %output%
label-foreground = ${colors.primary}
label-maxlen = 60
click-left = pamixer -t
click-middle = /usr/share/navi/wired/waybar/mod-open.sh "audio switch" /usr/share/navi/wired/waybar/audio-switch.sh &
click-right = /usr/share/navi/wired/waybar/mod-open.sh "navi-audio" navi-audio &
scroll-up = pamixer -i 5
scroll-down = pamixer -d 5

[module/network]
type = internal/network
interface-type = wireless
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = %{A1:alacritty -e navi-networks &:} %signal%%%{A}
label-connected-foreground = ${colors.primary}
label-connected-background = ${colors.background}
label-connected-padding = 2
label-disconnected = %{A1:alacritty -e navi-networks &:}%{A}
label-disconnected-foreground = ${colors.alert}
label-disconnected-background = ${colors.background}
label-disconnected-padding = 2
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi-networking" navi-networking &

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>
label-charging = "%percentage%% "
label-discharging = "%percentage%% "
label-full = "%percentage%% "
label-charging-foreground = ${colors.primary}
label-discharging-foreground = ${colors.primary}
label-full-foreground = ${colors.primary}
label-charging-background = ${colors.background}
label-discharging-background = ${colors.background}
label-full-background = ${colors.background}
label-charging-padding = 2
label-discharging-padding = 2
label-full-padding = 2
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi-power" navi-power &

[module/tray]
type = internal/tray
format = <tray>
tray-spacing = 6px
format-margin = 4px

[module/weather]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/weather.sh
interval = 600
label = %output%
label-foreground = ${colors.cyan}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi weather" navi-weather &

[module/update]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/update-check.sh
interval = 300
label = %output%
label-foreground = ${colors.primary}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi-update" /usr/share/navi/wired/waybar/navi-update-click.sh &

[module/bluetooth]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/bluetooth-mod.sh
interval = 5
label = %output%
label-foreground = ${colors.cyan}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi bluetooth" navi-bluetooth &
click-right = /usr/share/navi/wired/waybar/mod-open.sh "bluetooth menu" /usr/share/navi/wired/waybar/bluetooth-menu.sh &
scroll-up = bluetoothctl power on
scroll-down = bluetoothctl power off

[module/tailscale]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/tailscale-mod.sh
interval = 10
label = %output%
label-foreground = ${colors.primary}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi tailscale" navi-tailscale &
click-right = tailscale up || tailscale down

[module/agent]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/agent-mod.sh
interval = 5
label = %output%
label-foreground = ${colors.primary}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi-agents-config" navi-agents-config &
click-middle = /usr/share/navi/wired/waybar/mod-open.sh "herdr" herdr &
click-right = /usr/share/navi/wired/waybar/mod-open.sh "agent menu" /usr/share/navi/wired/waybar/agent-menu.sh &

[module/bell]
type = custom/script
exec = /usr/share/navi/wired/polybar/waybar-json.sh /usr/share/navi/wired/waybar/notif-bell.sh
interval = 10
label = %output%
label-foreground = ${colors.secondary}
click-left = /usr/share/navi/wired/waybar/mod-open.sh "navi-notifs" navi-notifs &

[module/custom/power]
type = custom/text
label = %{A1:/usr/bin/power_menu:}%{A}
label-foreground = ${colors.primary}
label-background = ${colors.background}
label-padding = 2

[settings]
screenchange-reload = true
pseudo-transparency = false

