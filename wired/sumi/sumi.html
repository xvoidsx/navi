<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sumi 墨 — just writing</title>
<style>
  :root {
    --bg: #0a0a0f;
    --ink: #e8e6e3;
    --ink-dim: #8a8791;
    --ink-faint: #4a4852;
    --pink: #ff2e88;
    --pink-dim: #a11650;
    --green: #39ff14;
    --cyan: #00e5ff;
    --serif: "Noto Serif", "DejaVu Serif", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    overflow: hidden;
  }

  /* ---------- splash ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    cursor: pointer;
    transition: opacity .6s ease;
  }
  #splash.gone { opacity: 0; pointer-events: none; }
  #splash .kanji {
    font-size: clamp(90px, 18vw, 160px);
    line-height: 1;
    color: var(--pink);
    text-shadow: 0 0 18px rgba(255,46,136,.75),
                 0 0 60px rgba(255,46,136,.35),
                 0 0 120px rgba(255,46,136,.2);
    opacity: 0;
    filter: blur(14px);
    animation: ink-in 1.6s ease forwards;
  }
  #splash .word {
    font-family: var(--mono);
    font-size: 15px; letter-spacing: .55em; text-indent: .55em;
    color: var(--ink-dim);
    opacity: 0;
    animation: fade-in 1.2s ease .9s forwards;
  }
  #splash .hint {
    font-family: var(--mono);
    font-size: 11px; letter-spacing: .2em;
    color: var(--ink-faint);
    opacity: 0;
    animation: fade-in 1s ease 1.6s forwards;
  }
  @keyframes ink-in { to { opacity: 1; filter: blur(0); } }
  @keyframes fade-in { to { opacity: 1; } }



/* ---------- chrome ---------- */
  #bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px;
    background: linear-gradient(to bottom, rgba(10,10,15,.95), rgba(10,10,15,0));
    font-family: var(--mono); font-size: 12px;
    color: var(--ink-faint);
    opacity: 0; transition: opacity .25s ease;
  }
  body:hover #bar, #bar:focus-within { opacity: 1; }
  #bar .logo { color: var(--pink); font-size: 16px; }
  #docname {
    background: none; border: none; outline: none;
    font: inherit; color: var(--ink-dim);
    width: 220px;
  }
  #docname:focus { color: var(--ink); }
  #bar .spacer { flex: 1; }
  #bar button {
    font: inherit; color: var(--ink-dim);
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
  }
  #bar button:hover { color: var(--pink); border-color: var(--pink-dim); }
  #btn-mode.active { color: var(--pink); }
  #btn-focus.active, #btn-type.active { color: var(--pink); }

  /* focus mode: dim everything but the caret's paragraph */
  body[data-focus="on"] #editor .line { opacity: .28; transition: opacity .3s ease; }
  body[data-focus="on"] #editor .line.active { opacity: 1; }
  #save-state { min-width: 70px; text-align: right; }
  #save-state.saved { color: var(--green); }

  /* ---------- editor (single-layer contenteditable) ---------- */
  #wrap {
    position: fixed; inset: 0;
    overflow-y: auto;
    padding: 72px 24px 64px;
  }
  #editor {
    width: 100%; max-width: 720px;
    margin: 0 auto;
    min-height: calc(100vh - 136px);
    font-family: var(--serif);
    font-size: 19px; line-height: 1.75;
    padding: 8px 4px;
    outline: none;
    caret-color: var(--pink);
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  #editor .line { min-height: 1.75em; }
  #editor::selection, #editor *::selection { background: rgba(255,46,136,.25); }

  /* markdown tokens — single layer, so real formatting is safe */
  .tok-h  { color: var(--pink); font-weight: bold; }
  .tok-b  { color: #fff; font-weight: bold; }
  .tok-i  { color: var(--cyan); font-style: italic; }
  .tok-s  { color: var(--ink-faint); text-decoration: line-through; }
  .tok-c  { color: var(--green); font-family: var(--mono); font-size: .85em; }
  .tok-cb { color: var(--green); font-family: var(--mono); font-size: .85em; }
  .tok-a  { color: var(--cyan); text-decoration: underline; text-decoration-color: var(--pink-dim); }
  .tok-q  { color: var(--ink-dim); font-style: italic; }
  .tok-li { color: var(--pink); }
  .tok-hr { color: var(--ink-faint); }
  .delim  { color: var(--ink-faint); opacity: .55; }

  /* fenced code blocks */
  #editor .line.code {
    background: rgba(57, 255, 20, 0.055);
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.7;
    padding: 0 18px;
  }
  #editor .line.code-first {
    border-top-left-radius: 10px;
    border-top-right-radius: 10px;
    padding-top: 14px;
  }
  #editor .line.code-last {
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
    padding-bottom: 14px;
  }
  #editor .line.code-open { padding: 14px 4px 6px; }
  #editor .line.code-open .code-lang {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  #editor .line.code-close {
    height: 0; min-height: 0;
    padding: 0; overflow: hidden;
  }
  .tok-kw  { color: var(--pink); }
  .tok-str { color: var(--cyan); }
  .tok-com { color: var(--ink-faint); font-style: italic; }

  /* ---------- footer ---------- */
  #foot {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    display: flex; justify-content: flex-end; gap: 18px;
    padding: 12px 22px;
    font-family: var(--mono); font-size: 11px; letter-spacing: .08em;
    color: var(--ink-faint);
    background: linear-gradient(to top, rgba(10,10,15,.95), rgba(10,10,15,0));
    opacity: 0; transition: opacity .25s ease;
    pointer-events: none;
  }
  body:hover #foot { opacity: 1; }
  #foot .k { color: var(--pink-dim); }
  #foot .goal-met { color: var(--green); }
  #wordswrap { cursor: pointer; }
  #wordswrap:hover #words { color: var(--pink); }

  #filepick { display: none; }
</style>
</head>
<body>

<div id="splash" title="click anywhere">
  <div class="kanji">墨</div>
  <div class="word">sumi</div>
  <div class="hint">just writing</div>
</div>

<div id="bar">
  <span class="logo">墨</span>
  <input id="docname" value="untitled" spellcheck="false" autocomplete="off">
  <span class="spacer"></span>
  <span id="save-state"></span>
  <button id="btn-mode" title="toggle delimiters visible / hidden">md</button>
  <button id="btn-focus" title="focus mode: dim other paragraphs">focus</button>
  <button id="btn-type" title="typewriter mode: keep caret line centered">type</button>
  <button id="btn-open" title="open a markdown file">open</button>
  <button id="btn-save" title="save to disk">save</button>
  <button id="btn-new" title="new sheet">new</button>
</div>

<div id="wrap">
  <div id="editor" contenteditable="true" spellcheck="true"></div>
</div>

<div id="foot">
  <span id="wordswrap" title="click to set a word goal"><span class="k">words</span> <span id="words">0</span></span>
  <span><span class="k">chars</span> <span id="chars">0</span></span>
  <span id="readtime"></span>
  <span><span class="k">v2.3</span></span>
  <span><span class="k">md</span></span>
</div>

<input type="file" id="filepick" accept=".md,.markdown,.txt,text/markdown">

<script>
"use strict";
/* sumi 墨 — a quiet page for writing. offline-first, single file.
   Single-layer contenteditable: the DOM is a pure view of the `source`
   model. All edits flow through beforeinput -> source -> re-render,
   so the caret is always native and always correct. */

const $ = id => document.getElementById(id);
const editor = $("editor");
const docname = $("docname"), saveState = $("save-state");

/* ---------- splash ---------- */
const splash = $("splash");
let splashDone = false;
function dismissSplash() {
  if (splashDone) return;
  splashDone = true;
  splash.classList.add("gone");
  setTimeout(() => splash.remove(), 700);
  editor.focus();
}
splash.addEventListener("click", dismissSplash);
setTimeout(dismissSplash, 2600);
window.addEventListener("keydown", function once() {
  if (!splashDone) dismissSplash();
  window.removeEventListener("keydown", once);
}, { capture: true });

/* ---------- model ---------- */
let source = "";
let viewMap = [];   // view char offset -> source char offset
let srcCaret = 0;   // caret in source coordinates

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/* ---------- inline tokenizer ----------
   Emits visible HTML + a per-character source map.
   Delimiters are shown dimmed (md mode) or consumed (rich mode). */
const INLINE_RULES = [
  { re: /\*\*(.+?)\*\*/g,  cls: "tok-b", dl: 2 },
  { re: /__([^_]+?)__/g,   cls: "tok-b", dl: 2 },
  { re: /\*([^*\n]+?)\*/g, cls: "tok-i", dl: 1 },
  { re: /_([^_\n]+?)_/g,   cls: "tok-i", dl: 1 },
  { re: /~~(.+?)~~/g,      cls: "tok-s", dl: 2 },
  { re: /`([^`\n]+?)`/g,   cls: "tok-c", dl: 1 },
];
const LINK_RE = /\[([^\]]+?)\]\(([^)]+?)\)/g;

function tokenizeInline(text, srcBase, rich) {
  let html = "";
  const map = [];
  const n = text.length;
  let i = 0;

  const emitVisible = (t, s, cls) => {
    html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    for (let k = 0; k < t.length; k++) map.push(s + k);
  };
  const emitDelim = (t, s) => {
    if (rich) return; // consumed
    html += `<span class="delim">${esc(t)}</span>`;
    for (let k = 0; k < t.length; k++) map.push(s + k);
  };

  while (i < n) {
    let bestIdx = -1, bestRule = null, bestM = null;
    for (const rule of INLINE_RULES) {
      rule.re.lastIndex = i;
      const m = rule.re.exec(text);
      if (m && (bestIdx === -1 || m.index < bestIdx)) {
        bestIdx = m.index; bestRule = rule; bestM = m;
      }
    }
    LINK_RE.lastIndex = i;
    const lm = LINK_RE.exec(text);
    if (lm && (bestIdx === -1 || lm.index < bestIdx)) {
      bestIdx = lm.index; bestRule = "link"; bestM = lm;
    }

    if (bestIdx === -1) {
      emitVisible(text.slice(i), srcBase + i, null);
      break;
    }
    if (bestIdx > i) emitVisible(text.slice(i, bestIdx), srcBase + i, null);

    if (bestRule === "link") {
      const full = bestM[0], label = bestM[1];
      const ls = bestIdx + 1;
      emitDelim("[", srcBase + bestIdx);
      emitVisible(label, srcBase + ls, "tok-a");
      emitDelim(full.slice(1 + label.length), srcBase + ls + label.length);
    } else {
      const dl = bestRule.dl, full = bestM[0], inner = bestM[1];
      const is = bestIdx + dl;
      emitDelim(full.slice(0, dl), srcBase + bestIdx);
      emitVisible(inner, srcBase + is, bestRule.cls);
      emitDelim(full.slice(dl + inner.length), srcBase + is + inner.length);
    }
    i = bestIdx + bestM[0].length;
  }
  return { html, map };
}

/* ---------- code syntax highlighting (lightweight, generic) ---------- */
const CODE_RULES = [
  { re: /"[^"\n]*"|'[^'\n]*'|`[^`\n]*/g, cls: "tok-str" },
  { re: /(#[^\n]*|\/\/[^\n]*)/g, cls: "tok-com" },
  { re: /\b(local|echo|if|then|elif|else|fi|for|while|until|do|done|in|function|return|break|continue|case|esac|var|let|const|import|from|export|default|class|def|print|new|delete|typeof|instanceof|this|true|false|null|undefined|and|or|not)\b/g, cls: "tok-kw" },
];

function highlightCode(text, srcBase) {
  let html = "";
  const map = [];
  const emit = (t, s, cls) => {
    html += cls ? `<span class="${cls}">${esc(t)}</span>` : esc(t);
    for (let k = 0; k < t.length; k++) map.push(s + k);
  };
  let i = 0;
  while (i < text.length) {
    let best = null;
    for (const rule of CODE_RULES) {
      rule.re.lastIndex = i;
      const m = rule.re.exec(text);
      if (m && (!best || m.index < best.idx)) {
        best = { idx: m.index, len: m[0].length, cls: rule.cls };
      }
    }
    if (!best) {
      emit(text.slice(i), srcBase + i, null);
      break;
    }
    if (best.idx > i) emit(text.slice(i, best.idx), srcBase + i, null);
    emit(text.slice(best.idx, best.idx + best.len), srcBase + best.idx, best.cls);
    i = best.idx + best.len;
  }
  return { html, map };
}

/* ---------- block render ---------- */
function renderSource() {
  const rich = document.body.dataset.mode === "rich";
  const lines = source.split("\n");
  let html = "";
  viewMap = [];
  let srcOff = 0;
  let inCode = false;

  const pushMap = (map, base) => { for (const s of map) viewMap.push(s); };

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];
    let inner = "", lmap = [];
    let lineCls = "";

    const isFence = /^```/.test(line);
    if (isFence) inCode = !inCode;
    const opening = isFence && inCode;
    const closing = isFence && !inCode;
    const codeContent = inCode && !isFence;

    if (opening) {
      const lang = line.slice(3).trim();
      if (rich) {
        // hide the ``` — show just the language as a block label
        if (lang) {
          inner = `<span class="code-lang">${esc(lang)}</span>`;
          for (let k = 0; k < lang.length; k++) lmap.push(srcOff + 3 + k);
        }
      } else {
        const t = tokenizeInline(line, srcOff, false);
        inner = `<span class="tok-cb">${t.html || ""}</span>`;
        lmap = t.map;
      }
      lineCls = "code-open";
    } else if (closing) {
      if (rich) {
        // collapse the fence: invisible but still in the DOM for caret mapping
        inner = "";
      } else {
        const t = tokenizeInline(line, srcOff, false);
        inner = `<span class="tok-cb">${t.html || ""}</span>`;
        lmap = t.map;
      }
      lineCls = "code-close";
    } else if (codeContent) {
      const t = highlightCode(line, srcOff);
      inner = t.html;
      lmap = t.map;
      const prevFence = li > 0 && /^```/.test(lines[li - 1]);
      const nextFence = li + 1 < lines.length && /^```/.test(lines[li + 1]);
      lineCls = "code"
        + (prevFence || li === 0 ? " code-first" : "")
        + (nextFence || li === lines.length - 1 ? " code-last" : "");
    } else if (!inCode) {
      let m;
      if ((m = line.match(/^(#{1,6})(\s+)(.*)$/))) {
        const hl = m[1].length + m[2].length;
        const t = tokenizeInline(m[3], srcOff + hl, rich);
        let pre = "";
        if (!rich) {
          pre = `<span class="delim">${esc(m[1] + m[2])}</span>`;
          for (let k = 0; k < hl; k++) lmap.push(srcOff + k);
        }
        inner = `${pre}<span class="tok-h">${t.html}</span>`;
        lmap = lmap.concat(t.map);
      } else if ((m = line.match(/^(\s*>\s?)(.*)$/))) {
        const ql = m[1].length;
        const t = tokenizeInline(m[2], srcOff + ql, rich);
        let pre = "";
        if (!rich) {
          pre = `<span class="delim">${esc(m[1])}</span>`;
          for (let k = 0; k < ql; k++) lmap.push(srcOff + k);
        }
        inner = `${pre}<span class="tok-q">${t.html}</span>`;
        lmap = lmap.concat(t.map);
      } else if ((m = line.match(/^(\s*([-*+]|\d+\.)\s)(.*)$/))) {
        const ml = m[1].length;
        const t = tokenizeInline(m[3], srcOff + ml, rich);
        inner = `<span class="tok-li">${esc(m[1])}</span>${t.html}`;
        for (let k = 0; k < ml; k++) lmap.push(srcOff + k);
        lmap = lmap.concat(t.map);
      } else if (/^---+$/.test(line.trim()) || /^\*\*\*+$/.test(line.trim())) {
        inner = `<span class="tok-hr">${esc(line)}</span>`;
        for (let k = 0; k < line.length; k++) lmap.push(srcOff + k);
      } else if (line.trim() === "") {
        inner = "";
      } else {
        const t = tokenizeInline(line, srcOff, rich);
        inner = t.html;
        lmap = t.map;
      }
    }

    html += `<div class="line${lineCls ? " " + lineCls : ""}">${inner || "<br>"}</div>`;
    pushMap(lmap);
    // newline between blocks: visible in view, one source char
    if (li < lines.length - 1) viewMap.push(srcOff + line.length);
    srcOff += line.length + 1;
  }

  editor.innerHTML = html;
}

/* ---------- caret mapping ---------- */
function viewToSource(v) {
  // no visible chars: source is either empty or all-hidden markup —
  // view 0 belongs after it, not before it
  if (viewMap.length === 0) return source.length;
  // view 0 maps to the first VISIBLE char's source offset —
  // crucial when a line starts with hidden markup (e.g. "# " in rich mode)
  if (v <= 0) return viewMap[0];
  if (v >= viewMap.length) return source.length;
  return viewMap[v];
}
function sourceToView(s) {
  s = Math.max(0, Math.min(s, source.length));
  // find first view offset mapping to >= s
  for (let v = 0; v < viewMap.length; v++) {
    if (viewMap[v] >= s) return v;
  }
  return viewMap.length;
}
function lineDivs() {
  return Array.from(editor.querySelectorAll(":scope > div.line"));
}
function viewOffsetFromDOM(node, offset) {
  let v = 0;
  for (const line of lineDivs()) {
    if (line.contains(node)) {
      const w = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
      let t;
      while ((t = w.nextNode())) {
        if (t === node) return v + Math.min(offset, t.textContent.length);
        v += t.textContent.length;
      }
      return v;
    }
    v += line.textContent.length + 1; // +1 for the block break
  }
  return v;
}
function setCaretFromView(v) {
  const sel = window.getSelection();
  sel.removeAllRanges();
  const range = document.createRange();
  let remaining = Math.max(0, v);
  for (const line of lineDivs()) {
    const len = line.textContent.length;
    if (remaining <= len) {
      const w = document.createTreeWalker(line, NodeFilter.SHOW_TEXT);
      let t, acc = 0;
      while ((t = w.nextNode())) {
        if (acc + t.textContent.length >= remaining) {
          range.setStart(t, remaining - acc);
          range.collapse(true);
          sel.addRange(range);
          return;
        }
        acc += t.textContent.length;
      }
      // empty line or end — caret at line start
      range.setStart(line, 0);
      range.collapse(true);
      sel.addRange(range);
      return;
    }
    remaining -= (len + 1);
  }
  // past the end: last line, end
  const lines = lineDivs();
  const last = lines[lines.length - 1];
  range.setStart(last, last.childNodes.length);
  range.collapse(true);
  sel.addRange(range);
}
function getViewSelection() {
  const sel = window.getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
  const r = sel.getRangeAt(0);
  return {
    start: viewOffsetFromDOM(r.startContainer, r.startOffset),
    end: viewOffsetFromDOM(r.endContainer, r.endOffset),
  };
}
function setCaretFromSource(s) {
  srcCaret = Math.max(0, Math.min(s, source.length));
  setCaretFromView(sourceToView(srcCaret));
  updateFocusLine();
  typewriterScroll();
}

/* ---------- editing ---------- */
let undoStack = [], redoStack = [];
function pushUndo() {
  undoStack.push({ source, caret: srcCaret });
  if (undoStack.length > 100) undoStack.shift();
  redoStack = [];
}

function afterEdit() {
  renderSource();
  countWords();
  autosave();
}

editor.addEventListener("beforeinput", (e) => {
  const vsel = getViewSelection();
  if (!vsel) return; // outside editor — ignore
  const s0 = viewToSource(Math.min(vsel.start, vsel.end));
  const s1 = viewToSource(Math.max(vsel.start, vsel.end));
  const collapsed = s0 === s1;
  let caret = s0;

  const del = (a, b) => { source = source.slice(0, a) + source.slice(b); };

  // undo/redo first — they don't take a snapshot
  if (e.inputType === "historyUndo" || e.inputType === "historyRedo") {
    e.preventDefault();
    const from = e.inputType === "historyUndo" ? undoStack : redoStack;
    const to = e.inputType === "historyUndo" ? redoStack : undoStack;
    const prev = from.pop();
    if (!prev) return;
    to.push({ source, caret: srcCaret });
    source = prev.source;
    afterEdit();
    setCaretFromSource(Math.min(prev.caret, source.length));
    return;
  }

  pushUndo();

  switch (e.inputType) {
    case "insertText":
      if (!e.data) return;
      e.preventDefault();
      del(s0, s1);
      source = source.slice(0, s0) + e.data + source.slice(s0);
      caret = s0 + e.data.length;
      break;

    case "insertCompositionText":
      e.preventDefault();
      del(s0, s1);
      source = source.slice(0, s0) + (e.data || "") + source.slice(s0);
      caret = s0 + (e.data || "").length;
      break;

    case "deleteContentBackward":
      e.preventDefault();
      if (!collapsed) { del(s0, s1); caret = s0; }
      else if (s0 > 0) {
        // at view 0 with a hidden block prefix (e.g. "# " in rich mode),
        // backspace strips the whole prefix = unformat the line
        const v = sourceToView(s0);
        const hidden = viewMap.length > 0 ? viewMap[0] : source.length;
        if (v === 0 && hidden > 0 && s0 >= hidden) {
          del(0, hidden);
          caret = 0;
        } else {
          del(s0 - 1, s0); caret = s0 - 1;
        }
      }
      else return;
      break;

    case "deleteContentForward":
      e.preventDefault();
      if (!collapsed) { del(s0, s1); caret = s0; }
      else if (s0 < source.length) { del(s0, s0 + 1); caret = s0; }
      else return;
      break;

    case "deleteWordBackward": {
      e.preventDefault();
      if (!collapsed) { del(s0, s1); caret = s0; break; }
      const m = source.slice(0, s0).match(/\S+\s*$/);
      const cut = m ? s0 - m[0].length : Math.max(0, s0 - 1);
      del(cut, s0); caret = cut;
      break;
    }

    case "deleteWordForward": {
      e.preventDefault();
      if (!collapsed) { del(s0, s1); caret = s0; break; }
      const m = source.slice(s0).match(/^\s*\S+/);
      const cut = m ? s0 + m[0].length : Math.min(source.length, s0 + 1);
      del(s0, cut); caret = s0;
      break;
    }

    case "insertParagraph":
    case "insertLineBreak": {
      e.preventDefault();
      del(s0, s1);
      // continue list / quote markers onto the new line
      const lineStart = source.lastIndexOf("\n", s0 - 1) + 1;
      const cur = source.slice(lineStart, s0);
      let cont = "";
      const lm = cur.match(/^(\s*([-*+]|\d+\.)\s+)/);
      const qm = cur.match(/^(\s*>\s?)/);
      if (lm) {
        // numbered lists increment
        const nm = lm[1].match(/(\d+)\.\s*$/);
        cont = nm ? lm[1].replace(/\d+/, String(+nm[1] + 1)) : lm[1];
        // empty list item -> just outdent instead
        if (cur.trim() === lm[0].trim()) { del(lineStart, s0); source = source.slice(0, lineStart) + "\n" + source.slice(lineStart); caret = lineStart + 1; break; }
      } else if (qm) {
        cont = qm[1];
        if (cur.trim() === ">" || cur.trim() === "") { del(lineStart, s0); source = source.slice(0, lineStart) + "\n" + source.slice(lineStart); caret = lineStart + 1; break; }
      }
      source = source.slice(0, s0) + "\n" + cont + source.slice(s0);
      caret = s0 + 1 + cont.length;
      break;
    }

    case "insertFromPaste": {
      e.preventDefault();
      const text = (e.clipboardData || (e.dataTransfer && { getData: () => "" })).getData("text/plain");
      const clean = (e.clipboardData ? e.clipboardData.getData("text/plain") : "").replace(/\r\n?/g, "\n");
      del(s0, s1);
      source = source.slice(0, s0) + clean + source.slice(s0);
      caret = s0 + clean.length;
      break;
    }

    case "insertFromDrop":
      // file drops are handled at window level; text drops: treat as move = ignore
      e.preventDefault();
      return;

    default:
      // historyUndo/Redo, formatBold, etc: keep the model authoritative
      e.preventDefault();
      return;
  }

  afterEdit();
  setCaretFromSource(caret);
  // native contenteditable scrolling handles the rest (#wrap is the scroller)
});

// track caret on arrow-key / mouse navigation (no beforeinput fires)
document.addEventListener("selectionchange", () => {
  const sel = window.getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode) || !sel.isCollapsed) return;
  const r = sel.getRangeAt(0);
  srcCaret = viewToSource(viewOffsetFromDOM(r.startContainer, r.startOffset));
  updateFocusLine();
  typewriterScroll();
});

// ctrl/cmd+b / ctrl/cmd+i wrap selection in ** / *
// ctrl/cmd+z / ctrl/cmd+shift+z / ctrl/cmd+y: our own undo stack
editor.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) {
      e.preventDefault();
      editor.dispatchEvent(new InputEvent("beforeinput", { inputType: "historyUndo", bubbles: true, cancelable: true }));
      return;
    }
    if ((k === "z" && e.shiftKey) || k === "y") {
      e.preventDefault();
      editor.dispatchEvent(new InputEvent("beforeinput", { inputType: "historyRedo", bubbles: true, cancelable: true }));
      return;
    }
    if (!e.shiftKey) {
      if (k === "b" || k === "i") {
        e.preventDefault();
        const vsel = getViewSelection();
        if (!vsel) return;
        const s0 = viewToSource(Math.min(vsel.start, vsel.end));
        const s1 = viewToSource(Math.max(vsel.start, vsel.end));
        const mark = k === "b" ? "**" : "*";
        const inner = source.slice(s0, s1) || "text";
        pushUndo();
        source = source.slice(0, s0) + mark + inner + mark + source.slice(s1);
        afterEdit();
        setCaretFromSource(s0 + mark.length + inner.length + mark.length);
        return;
      }
      if (k === "s") {
        e.preventDefault();
        saveToDisk();
        return;
      }
    }
  }
  if (e.key === "Tab") {
    e.preventDefault();
    const vsel = getViewSelection();
    if (!vsel) return;
    const s0 = viewToSource(Math.min(vsel.start, vsel.end));
    const s1 = viewToSource(Math.max(vsel.start, vsel.end));
    pushUndo();
    source = source.slice(0, s0) + "  " + source.slice(s1);
    afterEdit();
    setCaretFromSource(s0 + 2);
  }
});

  /* ---------- focus mode + typewriter mode ---------- */
function caretLineDiv() {
  const sel = window.getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
  let node = sel.getRangeAt(0).startContainer;
  while (node && node !== editor) {
    if (node.nodeType === 1 && node.classList.contains("line")) return node;
    node = node.parentNode;
  }
  return null;
}

function updateFocusLine() {
  if (document.body.dataset.focus !== "on") return;
  const active = caretLineDiv();
  for (const l of lineDivs()) l.classList.toggle("active", l === active);
}

let lastTwLine = null;
function typewriterScroll() {
  if (document.body.dataset.typewriter !== "on") return;
  const line = caretLineDiv();
  if (!line || line === lastTwLine) return;
  lastTwLine = line;
  const wrap = $("wrap");
  const wr = wrap.getBoundingClientRect();
  const lr = line.getBoundingClientRect();
  wrap.scrollTop += (lr.top + lr.height / 2) - (wr.top + wr.height / 2);
}

function initToggle(btnId, storeKey, attr, onChange) {
  const b = $(btnId);
  let on = false;
  try { on = localStorage.getItem(storeKey) === "on"; } catch (e) {}
  document.body.dataset[attr] = on ? "on" : "off";
  b.classList.toggle("active", on);
  b.addEventListener("click", () => {
    const now = document.body.dataset[attr] !== "on";
    document.body.dataset[attr] = now ? "on" : "off";
    b.classList.toggle("active", now);
    try { localStorage.setItem(storeKey, now ? "on" : "off"); } catch (e) {}
    onChange(now);
  });
  onChange(on);
}
initToggle("btn-focus", "sumi.focus", "focus", (on) => {
  if (on) updateFocusLine();
  else for (const l of lineDivs()) l.classList.remove("active");
});
initToggle("btn-type", "sumi.typewriter", "typewriter", () => {
  lastTwLine = null;
  typewriterScroll();
});

/* ---------- chrome ---------- */
const GOAL_KEY = "sumi.goal";
let wordGoal = 0;
try { wordGoal = Math.max(0, parseInt(localStorage.getItem(GOAL_KEY) || "0", 10) || 0); } catch (e) {}

function countWords() {
  const t = source;
  const w = t.trim() === "" ? 0 : t.trim().split(/\s+/).length;
  const wEl = $("words");
  wEl.textContent = wordGoal > 0 ? `${w} / ${wordGoal}` : String(w);
  wEl.classList.toggle("goal-met", wordGoal > 0 && w >= wordGoal);
  $("chars").textContent = t.length;
  $("readtime").textContent = w > 0 ? `~${Math.max(1, Math.ceil(w / 200))} min` : "";
}
$("wordswrap").addEventListener("click", () => {
  const v = prompt("Word goal (0 to clear):", wordGoal ? String(wordGoal) : "");
  if (v === null) return;
  wordGoal = Math.max(0, parseInt(v, 10) || 0);
  try { localStorage.setItem(GOAL_KEY, String(wordGoal)); } catch (e) {}
  countWords();
});

const LS_KEY = "sumi.scratch", MODE_KEY = "sumi.mode", NAME_KEY = "sumi.name";
let fileHandle = null;
let dirty = false, saveTimer = null;

function setSaved(saved) {
  saveState.textContent = saved ? "saved" : "•";
  saveState.classList.toggle("saved", saved);
}
function autosave() {
  dirty = true;
  setSaved(false);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ text: source, at: Date.now() }));
      localStorage.setItem(NAME_KEY, docname.value);
      if (!fileHandle) { dirty = false; setSaved(true); }
    } catch (e) {}
  }, 800);
}
async function saveToDisk() {
  const name = (docname.value || "untitled").replace(/[^\w\- ]+/g, "").trim() || "untitled";
  try {
    if (window.showSaveFilePicker) {
      if (!fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: name + ".md",
          types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }]
        });
      }
      const w = await fileHandle.createWritable();
      await w.write(source);
      await w.close();
      docname.value = (await fileHandle.getFile()).name.replace(/\.md$/, "");
    } else {
      const blob = new Blob([source], { type: "text/markdown" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".md";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }
    dirty = false; setSaved(true);
  } catch (e) {
    if (e.name !== "AbortError") setSaved(false);
  }
}
async function openFile(file) {
  if (!file) return;
  if (dirty && !confirm("Discard unsaved changes?")) return;
  source = await file.text();
  docname.value = file.name.replace(/\.(md|markdown|txt)$/, "");
  fileHandle = null;
  afterEdit();
  setCaretFromSource(source.length);
  setSaved(true);
  editor.focus();
}

$("btn-save").addEventListener("click", saveToDisk);
$("btn-new").addEventListener("click", () => {
  if (dirty && !confirm("Discard unsaved changes?")) return;
  source = ""; docname.value = "untitled"; fileHandle = null;
  afterEdit(); setCaretFromSource(0); setSaved(true); editor.focus();
});
$("btn-open").addEventListener("click", () => $("filepick").click());
$("filepick").addEventListener("change", e => {
  openFile(e.target.files[0]);
  e.target.value = "";
});
docname.addEventListener("input", autosave);
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) openFile(f);
});

/* ---------- render mode ---------- */
function setMode(mode) {
  document.body.dataset.mode = mode;
  const b = $("btn-mode");
  b.textContent = mode === "rich" ? "rich" : "md";
  b.classList.toggle("active", mode === "rich");
  b.title = mode === "rich" ? "delimiters hidden — click to show" : "delimiters shown — click to hide";
  try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  renderSource();
}
$("btn-mode").addEventListener("click", () => {
  setMode(document.body.dataset.mode === "rich" ? "md" : "rich");
});

/* ---------- boot ---------- */
try {
  const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
  if (s && s.text) source = s.text;
  const nm = localStorage.getItem(NAME_KEY);
  if (nm) docname.value = nm;
} catch (e) {}
try {
  document.body.dataset.mode = localStorage.getItem(MODE_KEY) === "rich" ? "rich" : "md";
} catch (e) {
  document.body.dataset.mode = "md";
}
{
  const b = $("btn-mode");
  const rich = document.body.dataset.mode === "rich";
  b.textContent = rich ? "rich" : "md";
  b.classList.toggle("active", rich);
}
renderSource();
countWords();
setSaved(true);
setCaretFromSource(0);
</script>
