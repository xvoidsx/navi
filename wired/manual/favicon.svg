<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#000000" stroke="#39ff14" stroke-width="2.5"/>
  <g filter="url(#glow)" stroke="#ff10f0" fill="none" stroke-linecap="round">
    <circle cx="32" cy="32" r="15" stroke-width="7"/>
    <line x1="21" y1="43" x2="43" y2="21" stroke-width="6"/>
  </g>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.35"/>
</svg>
