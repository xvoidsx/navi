-- naviOS conky configuration
-- ( this file should live at $HOME/.conkyrc  or /etc/conky/conky.conf )

conky.config = {
    alignment = 'bottom_right',
    background = false,
    border_width = 1,
    border_inner_margin = 9,
    cpu_avg_samples = 2,
    default_color = '#ffffff',
    default_outline_color = '#ff10f0',
    default_shade_color = '#000000',
    draw_borders = true,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    double_buffer = true,
    font = 'JetBrains Mono:style=Bold:size=9',
    gap_x = 16,
    gap_y = 24,
    minimum_height = 5,
    minimum_width = 250,
    maximum_width = 250,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    out_to_wayland = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = true,
    own_window_type = 'override',
    stippled_borders = 0,
    update_interval = 1,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

conky.text = [[
${font JetBrains Mono:style=Bold:size=9}${blink ${color #39ff14}✦${color}} ${color #ff10f0}${scroll 18 n a v i}${color} ${blink ${color #ff10f0}✦${color}}${font}
${color #39ff14}${hr 1}${color}
${font JetBrains Mono:style=Bold:size=16}${color #ffffff}${time %H:%M}${font}${alignr}${color #ff10f0}${time %a}${color #ffffff} ${time %d}
${font JetBrains Mono:style=Bold:size=8}${color #00ffff}SIGNAL:: ${color #ff10f0}${execi 1 sh -c 'case $(( $(date +%s) % 8 )) in 0) printf "L4IN//";; 1) printf "L A I N";; 2) printf "L//AIN";; 3) printf "LA1N";; 4) printf "L.A.I.N";; 5) printf "L4-1N";; 6) printf "L A // N";; *) printf "lain";; esac'}${alignr}${color #ffffff}uptime ${color #00ffff}${uptime}${font}

${color #ff10f0}CPU${alignr}${color #ffffff}${cpu cpu0}%
${color #39ff14}${cpubar 5,226}
${color #00ffff}MEMORY${alignr}${color #ffffff}${mem} / ${memmax}
${color #ff10f0}${membar 5,226}
${color #39ff14}ROOT${alignr}${color #ffffff}${fs_used /} / ${fs_size /}
${color #00ffff}${fs_bar 5,226 /}

${color #ff10f0}${hr 1}
${font JetBrains Mono:style=Bold:size=13}${blink ${color #39ff14}~${color}} ${color #ff10f0}${scroll 24 let's all love lain}${alignr}${blink ${color #ff10f0}✦ ✦ ✦${color}}${font}
${color #00ffff}NET▾${alignr}${color #ffffff}${downspeed} / ${upspeed} ▴
${color #39ff14}${downspeedgraph 18,226 ff10f0 39ff14}
${color #ff10f0}TOP${alignr}${color #ffffff}${top name 1} ${top cpu 1}%
${color #8a8a8a}${execi 1 python3 -c 'import random;print("".join(random.choice("▓▒░█ ") for _ in range(30)))'}${color}

${font JetBrains Mono:style=Bold:size=8}${color #39ff14}[ ${color #ffffff}present day, present time${color #39ff14} ]${font}
]]

