# wired picom — the X11 bonus round.
#
# This is the stuff sway fundamentally can't do: real frosted-glass blur,
# rounded corners, inactive-window dimming, soft shadows.
# Bonus for using X11.
#
# Performance note: blur is the most GPU-expensive effect here. On weak
# hardware (looking at you, 2015 Celerons), flip it off any time with
# `navi-blur-toggle` (bound in the i3 config) — everything else stays.

backend = "glx";

# -- fading: smooth window open/close --
fading = true;
fade-delta = 8;
fade-in-step = 0.03;
fade-out-step = 0.03;

# -- shadows: soft, subtle, barely there --
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.32;
shadow-offset-x = 0;
shadow-offset-y = 6;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

# -- frosted glass --
blur: {
  method = "kernel";
  strength = 8;
  background = true;
  background-frame = false;
  background-fixed = false;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# -- rounded corners --
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# -- focus emphasis: unfocused windows recede --
inactive-dim = 0.10;
active-opacity = 1.0;
inactive-opacity = 0.94;

# -- the bar gets the frosted treatment too --
opacity-rule = [
  "95:class_g = 'Polybar' && window_type = 'dock'"
];
