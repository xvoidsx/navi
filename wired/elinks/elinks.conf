# navi / wired ELinks configuration
# Dark nightshadeNeon theme for the learn manual and general browsing.
# Only options from elinks.conf(5) are used here; unknown options cause
# "bad option" errors, so this file sticks to the documented set.
#
# The white-bars fix: use_document_colors = 1 keeps the manual's own
# foreground colors but forces EVERY background to our black, so no
# element can render a light default background over the content.

# --- document colors (all <color|#rrggbb>) ---
set document.colors.text = "#ffffff"
set document.colors.background = "#000000"
set document.colors.link = "#ff3131"
set document.colors.vlink = "#39ff14"
set document.colors.image = "#00ffff"
set document.colors.bookmark = "#ff10f0"
set document.colors.dirs = "#39ff14"

# 0 = always our defaults, 1 = document colors except background,
# 2 = document colors including background. 1 kills the white bars
# while keeping the manual's magenta/green text.
set document.colors.use_document_colors = 1

# never let fg == bg, and boost low-contrast pairs for readability
set document.colors.ensure_contrast = 1
set document.colors.increase_contrast = 1

# --- terminal: 256-color mode + transparency for alacritty ---
# color modes: 0 = mono, 1 = 16 colors, 2 = 88 colors,
#              3 = 256 colors (XTerm RGB codes), 4 = true color
# alacritty reports TERM=alacritty, so pin it directly; the template
# covers any other terminal elinks encounters.
set terminal.alacritty.colors = 3
set terminal._template_.colors = 3
# transparency: don't paint the background at all — alacritty's own
# transparent background shows through, so elinks blends into the
# nightshadeNeon terminal like everything else.
set terminal.alacritty.transparency = 1
set terminal._template_.transparency = 1

# --- user stylesheet: strip element backgrounds ---
# kills white blocks from elements carrying their own light backgrounds
# (form widgets, tables, etc). path is relative to ~/.elinks/.
set document.css.enable = 1
set document.css.stylesheet = "navi.css"
