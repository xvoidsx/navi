# navi / wired ELinks configuration
# Dark nightshadeNeon theme for the learn manual and general browsing.
# Fixes white bars / washed-out elements by pinning every document color
# to an explicit dark-theme value instead of ELinks' light defaults.
# (ELinks ignores unknown options harmlessly; core colors below are standard.)

# --- document colors: everything on black, no surprises ---
set document.colors.text = "white"
set document.colors.background = "black"
set document.colors.link = "red"
set document.colors.vlink = "green"
set document.colors.image = "cyan"
set document.colors.bookmark = "yellow"
set document.colors.title = "magenta"

# structural elements that otherwise default to light backgrounds
# (these are the white bars over manual content)
set document.colors.hr = "magenta"
set document.colors.frame = "black"
set document.colors.table = "white"
set document.colors.th = "magenta"

# force our palette; keep contrast readable even if a page fights it
set document.colors.use_document_colors = 1
set document.colors.ensure_contrast = 1
