####################################
# - - - N A V I - - -              #
# elinks config for navi.          #
# ( ~/.config/elinks/elinks.conf ) #
####################################

# --- terminal: 256-color mode + transparency for alacritty ---
# color modes: 0 = mono, 1 = 16 colors, 2 = 88 colors,
#              3 = 256 colors (XTerm RGB codes), 4 = true color
set terminal.alacritty.colors = 3
set terminal._template_.colors = 3
# transparency: don't paint the background at all — alacritty's own
# transparent background shows through, so elinks blends into the
# nightshadeNeon terminal like everything else.
set terminal.alacritty.transparency = 1
set terminal._template_.transparency = 1

# --- document rendering ---
set document.css.enable = 1

# --- force elinks to ignore document backgrounds ---
# 0 = always use terminal default text/background colors (kills white bars)
# 1 = use document text colors, but skip document backgrounds
set document.colors.use_document_colors = 0

##############################
# Manually verified on the Cloudbook (2026-09-15)
#
# What elinks itself auto-saved after manual in-UI configuration on the
# test bench — the known-good rendering state. Shipped verbatim so a
# fresh install matches it byte-for-byte.
  set config.saving_style_w = 1
    set terminal.alacritty.transparency = 1
    set terminal.alacritty.type = 5
  set ui.language = "System"
    set terminal.alacritty.colors = 3
