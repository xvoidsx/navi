<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>navi walls</title>
<style>
  :root {
    --pink: #ff10f0; --green: #39ff14; --cyan: #00ffff;
    --ink: #050407; --paper: #f6f0f7; --muted: #c9bdca;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 120%, rgba(255,16,240,.12), transparent 60%),
                radial-gradient(ellipse at 50% -20%, rgba(0,255,255,.06), transparent 50%),
                var(--ink);
    color: var(--paper);
    font-family: "IBM Plex Mono", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  h1 {
    font-family: "Share Tech Mono", monospace; font-size: 22px; letter-spacing: 6px;
    color: var(--paper); text-shadow: 0 0 12px rgba(255,16,240,.6);
    margin-bottom: 6px;
  }
  h1 span { color: var(--pink); }
  .subtitle { font-size: 11px; color: var(--muted); margin-bottom: 24px; letter-spacing: 2px; }

  #flow {
    width: 90vw; max-width: 1100px; height: 52vh; min-height: 320px;
    position: relative;
    perspective: 1400px;
    perspective-origin: 50% 40%;
  }
  .card {
    position: absolute; left: 50%; top: 50%;
    width: 420px; height: 240px; margin: -120px 0 0 -210px;
    border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255,16,240,.25);
    background: #0b080d;
    transition: transform .45s cubic-bezier(.2,.8,.25,1), opacity .45s, filter .45s, border-color .45s, box-shadow .45s;
    cursor: pointer;
  }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(5,4,7,.75); border: 1px solid rgba(0,255,255,.5); color: var(--cyan);
    letter-spacing: 1px;
  }
  .card.static .badge { border-color: rgba(57,255,20,.5); color: var(--green); }
  .card .name {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 12px 8px; font-size: 11px;
    background: linear-gradient(to top, rgba(5,4,7,.9), transparent);
    color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* positions set by JS via --off */
  .card { opacity: 0; pointer-events: none; }

  #info { margin-top: 22px; text-align: center; min-height: 44px; }
  #info .fname { font-family: "Share Tech Mono", monospace; font-size: 15px; color: var(--paper); }
  #info .fmeta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  #info .fmeta .anim { color: var(--cyan); }
  #hint { margin-top: 14px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  #hint b { color: var(--pink); font-weight: normal; }
  #count { position: absolute; top: 18px; right: 24px; font-size: 12px; color: var(--muted); }
  #count b { color: var(--pink); font-weight: normal; }
</style>
</head>
<body>
<div id="count"><b id="c-cur">1</b> / <span id="c-total">0</span></div>
<h1>navi <span>walls</span></h1>
<div class="subtitle">CHOOSE YOUR WALLPAPER</div>
<div id="flow"></div>
<div id="info"><div class="fname" id="i-name"></div><div class="fmeta" id="i-meta"></div></div>
<div id="hint"><b>&larr; &rarr;</b> browse &nbsp;&middot;&nbsp; <b>enter</b> set &nbsp;&middot;&nbsp; <b>esc</b> cancel</div>
<script>
/* WALLPAPERS injected by the launcher: [{path, name, type}] */
var WALLS = [];
var idx = 0;
var flow = document.getElementById('flow');

function build(){
  document.getElementById('c-total').textContent = WALLS.length;
  WALLS.forEach(function(w, i){
    var d = document.createElement('div');
    d.className = 'card ' + w.type;
    d.dataset.i = i;
    var img = document.createElement('img');
    img.src = w.path;
    img.draggable = false;
    d.appendChild(img);
    var b = document.createElement('div');
    b.className = 'badge';
    b.textContent = w.type === 'animated' ? 'GIF' : 'IMG';
    d.appendChild(b);
    var n = document.createElement('div');
    n.className = 'name'; n.textContent = w.name;
    d.appendChild(n);
    d.addEventListener('click', function(){ select(i); });
    flow.appendChild(d);
  });
  layout();
}

function layout(){
  var cards = flow.children;
  document.getElementById('c-cur').textContent = idx + 1;
  var w = WALLS[idx];
  document.getElementById('i-name').textContent = w.name;
  document.getElementById('i-meta').innerHTML =
    (w.type === 'animated' ? '<span class="anim">animated gifpaper</span>' : 'static wallpaper') +
    ' &middot; ' + w.dims;
  for (var i = 0; i < cards.length; i++){
    var off = i - idx;
    var c = cards[i];
    if (Math.abs(off) > 4) {
      c.style.opacity = '0'; c.style.pointerEvents = 'none';
      continue;
    }
    c.style.opacity = off === 0 ? '1' : String(Math.max(0.25, 1 - Math.abs(off)*0.22));
    c.style.pointerEvents = 'auto';
    var x = off * 300;
    var rot = off * -38;
    var z = -Math.abs(off) * 160;
    var sc = off === 0 ? 1 : 0.82;
    c.style.transform = 'translateX(' + x + 'px) translateZ(' + z + 'px) rotateY(' + rot + 'deg) scale(' + sc + ')';
    c.style.zIndex = String(100 - Math.abs(off));
    c.style.filter = off === 0 ? 'none' : 'brightness(.55) saturate(.8)';
    c.style.borderColor = off === 0 ? 'rgba(255,16,240,.75)' : 'rgba(255,16,240,.25)';
    c.style.boxShadow = off === 0 ? '0 0 34px rgba(255,16,240,.45)' : 'none';
  }
}

function move(d){
  idx = (idx + d + WALLS.length) % WALLS.length;
  layout();
}
function select(i){
  if (typeof i === 'number') idx = i;
  fetch('/select?path=' + encodeURIComponent(WALLS[idx].path))
    .then(function(){ window.close(); })
    .catch(function(){ window.close(); });
}

document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') move(-1);
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'Enter') select();
  else if (e.key === 'Escape') window.close();
});
flow.addEventListener('wheel', function(e){
  e.preventDefault();
  move(e.deltaY > 0 ? 1 : -1);
}, {passive: false});

build();
</script>
</body>
</html>
